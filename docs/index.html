<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Late Night Handoffs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e13;
    --bg-grid: #0e141b;
    --surface: #131a22;
    --surface-2: #1a2430;
    --surface-3: #212c3a;
    --border: rgba(233,238,243,0.09);
    --border-strong: rgba(233,238,243,0.16);
    --ink: #e9eef3;
    --ink-dim: #93a3b3;
    --ink-faint: #5c6b7a;
    --gold: #f2b441;
    --gold-ink: #2a1c05;
    --gold-dim: rgba(242,180,65,0.14);
    --gold-border: rgba(242,180,65,0.38);
    --green: #3fb68a;
    --green-dim: rgba(63,182,138,0.16);
    --red: #f0553d;
    --red-dim: rgba(240,85,61,0.16);
    /* position-group categorical (fixed order, adjacent-CVD-safe steps) */
    --pos-qb: #3987e5;
    --pos-rb: #d95926;
    --pos-wr: #199e70;
    --pos-te: #c98500;
    --pos-flex: #d55181;
    --pos-other: #9085e9;
  }

  *{ box-sizing: border-box; }
  html{ background: var(--bg); }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 100% 64px, 64px 100%;
    color: var(--ink);
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-inline: 14px;
    padding-block: 20px 56px;
  }

  a{ color: inherit; }
  h1,h2,h3{ text-wrap: balance; margin: 0; }
  button{ font-family: inherit; }

  .wrap{ max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  /* ---- scoreboard header ---- */
  .scoreboard{
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .scoreboard .league{
    font-family:'Teko', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 6vw, 30px);
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--ink);
    text-decoration:none;
  }
  .scoreboard .league span{ color: var(--gold); }
  .scoreboard .meta{ display:flex; align-items:center; gap:10px; }
  .week-select{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--surface-3);
    color: var(--ink);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 10px;
    min-height: 32px;
  }

  .eyebrow{
    font-family:'Teko', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::after{ content:""; height:1px; flex:1; background: var(--border); }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; color: var(--ink-dim); text-decoration:none;
    padding: 8px 4px; margin: -8px 0 -8px -4px;
  }
  .back-link:hover{ color: var(--gold); }

  /* ---- spotlight cards ---- */
  .spotlights{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px){ .spotlights{ grid-template-columns: 1fr; } }

  .standouts-grid{ display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  @media (max-width: 560px){ .standouts-grid{ grid-template-columns: 1fr; } }

  .spotlight{
    border-radius: 10px; padding: 16px 16px 18px;
    background: var(--surface); border: 1px solid var(--border);
    border-top: 3px solid var(--tone, var(--gold));
    display: flex; flex-direction: column; gap: 10px;
  }
  .spotlight.best{ --tone: var(--gold); }
  .spotlight.worst{ --tone: var(--red); }
  .spotlight .tag{ font-family:'Teko', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tone); }
  .spotlight .team-name{ font-family:'Teko', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.05; }
  .spotlight .owner{ font-size: 13px; color: var(--ink-dim); margin-top: -6px; }
  .spotlight .score-row{ display:flex; align-items:baseline; gap:8px; font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .spotlight .score-row .score{ font-size: 24px; font-weight: 700; color: var(--tone); }
  .spotlight .score-row .record{ font-size: 11.5px; color: var(--ink-faint); }
  .spotlight ul{ margin: 4px 0 0; padding-left: 18px; display:flex; flex-direction:column; gap:6px; }
  .spotlight li{ font-size: 13px; line-height: 1.45; color: var(--ink); }

  /* ---- generic card ---- */
  .card{ background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 18px; }
  .card h3{ font-family:'Teko', sans-serif; font-size:16px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-dim); margin-bottom: 12px; }
  .card .sub{ font-size: 11px; color: var(--ink-faint); margin: -8px 0 12px; }

  /* ---- power rankings list ---- */
  .rankings{ display:flex; flex-direction:column; gap:8px; }
  .row{ background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .row-head{
    all: unset; display: grid; grid-template-columns: 34px 50px 1fr auto auto 18px;
    align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
    cursor: pointer; box-sizing: border-box; min-height: 44px;
  }
  .row-head:hover{ background: var(--surface-2); }
  .row-head:focus-visible{ outline: 2px solid var(--gold); outline-offset: -2px; }
  .rank-num{ font-family:'Teko', sans-serif; font-size: 28px; font-weight: 600; color: var(--ink-faint); line-height: 1; }
  .row[data-rank="1"] .rank-num{ color: var(--gold); }
  .tick{ font-family:'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 3px 5px; border-radius: 5px; text-align:center; white-space: nowrap; }
  .tick.up{ color: var(--green); background: var(--green-dim); }
  .tick.down{ color: var(--red); background: var(--red-dim); }
  .tick.flat{ color: var(--ink-faint); background: var(--surface-3); }
  .team-block{ min-width:0; }
  .team-block .team{ font-family:'Teko', sans-serif; font-size: 19px; font-weight: 600; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-block .owner{ font-size: 11px; color: var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result{ font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.15; }
  .result .pts{ font-size: 16px; font-weight: 700; }
  .result .rec{ font-size: 10px; color: var(--ink-faint); }
  .chev{ color: var(--ink-faint); transition: transform 0.15s ease; font-size: 12px; }
  .row.open .chev{ transform: rotate(90deg); }
  @media (max-width: 420px){
    .row-head{ grid-template-columns: 28px 42px 1fr auto 16px; }
    .result .rec{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ .chev{ transition:none; } }

  .row-body{ display: none; padding: 4px 12px 16px; border-top: 1px solid var(--border); }
  .row.open .row-body{ display: block; }
  .blurb{ font-size: 13px; line-height: 1.55; color: var(--ink-dim); padding: 12px 0 14px; border-bottom: 1px dashed var(--border); margin-bottom: 10px; }
  .view-team-link{
    display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--gold); text-decoration:none; border:1px solid var(--gold-border);
    background: var(--gold-dim); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; min-height:32px;
  }
  .view-team-link:hover{ background: rgba(242,180,65,0.24); }

  /* ---- per-player bars (shared component) ---- */
  .lineup{ display:flex; flex-direction:column; gap:7px; }
  .p-row{ display:grid; grid-template-columns: minmax(90px,120px) 1fr 58px; align-items:center; gap:8px; }
  .p-name{ font-size: 12px; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p-name .pos{ color: var(--ink-faint); font-size: 9.5px; margin-right:4px; font-family:'JetBrains Mono',monospace; }
  .p-bar-track{ position:relative; height: 11px; background: var(--surface-3); border-radius: 3px; }
  .p-bar-fill{ position:absolute; top:0; left:0; height:100%; border-radius:3px; }
  .p-bar-fill.beat{ background: var(--green); }
  .p-bar-fill.missed{ background: var(--red); }
  .p-tick{ position:absolute; top:-2px; width:2px; height:15px; background: var(--ink); opacity:0.55; }
  .p-val{ font-family:'JetBrains Mono', monospace; font-size: 11px; text-align:right; font-variant-numeric: tabular-nums; }
  .p-val .delta{ font-size:9px; display:block; }
  .p-val .delta.beat{ color: var(--green); }
  .p-val .delta.missed{ color: var(--red); }
  .legend{ display:flex; gap:14px; font-size:10px; color:var(--ink-faint); align-items:center; margin-top:8px; flex-wrap:wrap; }
  .legend .sw{ display:inline-flex; align-items:center; gap:5px; }
  .legend .dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* ---- horizontal bar list (top scorers / league scores) ---- */
  .bar-list{ display:flex; flex-direction:column; gap:9px; }
  .bar-item{ display:grid; grid-template-columns: 18px minmax(88px,130px) 1fr 50px; align-items:center; gap:8px; }
  .bar-item .rk{ font-family:'Teko',sans-serif; font-size:15px; color: var(--ink-faint); }
  .bar-item .who{ font-size:12px; line-height:1.25; overflow:hidden; }
  .bar-item .who .tm{ display:block; font-size:9.5px; color: var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-item .track{ height:10px; background: var(--surface-3); border-radius:3px; position:relative; }
  .bar-item .fill{ position:absolute; left:0; top:0; height:100%; border-radius:3px; }
  .bar-item .pts{ font-family:'JetBrains Mono',monospace; font-size:12px; text-align:right; font-variant-numeric: tabular-nums; }

  .bust-list{ display:flex; flex-direction:column; gap:10px; }
  .bust{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding-bottom:9px; border-bottom:1px solid var(--border); }
  .bust:last-child{ border-bottom:none; padding-bottom:0; }
  .bust .who{ font-size:12px; }
  .bust .who .tm{ display:block; font-size:9.5px; color: var(--ink-faint); }
  .bust .nums{ font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right; color: var(--red); white-space:nowrap; }
  .bust .nums .proj{ display:block; color: var(--ink-faint); font-size:9.5px; }

  /* ---- stacked bar rows (position groups) ---- */
  .stack-list{ display:flex; flex-direction:column; gap:12px; }
  .stack-row .head{ display:flex; justify-content:space-between; font-size:11.5px; color: var(--ink-dim); margin-bottom:4px; gap:8px; }
  .stack-row .head b{ color: var(--ink); font-weight:700; }
  .stack-row .head .tot{ font-family:'JetBrains Mono',monospace; color: var(--ink-faint); }
  .stack-track{ display:flex; height:18px; border-radius:4px; overflow:hidden; background: var(--surface-3); }
  .stack-seg{ height:100%; }
  .stack-legend{ display:flex; flex-wrap:wrap; gap:10px 14px; font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
  .stack-legend .sw{ display:inline-flex; align-items:center; gap:5px; }
  .stack-legend .dot{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* ---- team header ---- */
  .team-header{ display:flex; flex-direction: column; gap:6px; }
  .team-header .name{ font-family:'Teko', sans-serif; font-size: clamp(30px,8vw,40px); font-weight:600; line-height:1; }
  .team-header .sub{ font-size: 13px; color: var(--ink-dim); }
  .stat-strip{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
  .stat-tile{ background: var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .stat-tile .lbl{ font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-faint); }
  .stat-tile .val{ font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; margin-top:2px; }

  /* ---- week trend bar chart ---- */
  .trend-scroll{ overflow-x:auto; padding-bottom:4px; }
  .trend-chart{ display:flex; align-items:flex-end; gap:10px; height:140px; min-width:min-content; }
  .trend-col{ display:flex; flex-direction:column; align-items:center; gap:6px; width:34px; height:100%; justify-content:flex-end; }
  .trend-bar{ width:100%; border-radius: 4px 4px 2px 2px; min-height:3px; }
  .trend-bar.win{ background: linear-gradient(180deg, var(--green), #237a5c); }
  .trend-bar.loss{ background: linear-gradient(180deg, var(--red), #a5321f); }
  .trend-val{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color: var(--ink-dim); }
  .trend-lbl{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color: var(--ink-faint); }

  /* ---- per-player week table ---- */
  .player-table-scroll{ overflow-x:auto; }
  .player-table{ display:flex; flex-direction:column; gap:10px; min-width:min-content; }
  .ptable-row{ display:grid; grid-template-columns: 130px repeat(var(--wk,1), 76px); gap:8px; align-items:center; }
  .ptable-name{ font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ptable-name .pos{ color: var(--ink-faint); font-size:9.5px; font-family:'JetBrains Mono',monospace; margin-right:4px; }
  .ptable-cell{ position:relative; height:20px; background: var(--surface-3); border-radius:4px; }
  .ptable-fill{ position:absolute; left:0; top:0; height:100%; border-radius:4px; }
  .ptable-fill.beat{ background: var(--green-dim); border-right:2px solid var(--green); }
  .ptable-fill.missed{ background: var(--red-dim); border-right:2px solid var(--red); }
  .ptable-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:10px; }
  .ptable-head{ display:grid; grid-template-columns: 130px repeat(var(--wk,1), 76px); gap:8px; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-faint); text-align:center; }
  .ptable-head span:first-child{ text-align:left; }

  footer{ text-align:center; font-size:11px; color: var(--ink-faint); padding-top: 8px; line-height:1.6; }
  footer .dot-sep{ margin: 0 6px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
let WEEKS = {};      // { 1: {...weekData}, 2: {...} }
let WEEK_NUMS = [];  // sorted [1,2,...]

const POS_ORDER = ['QB','RB','WR','TE','FLEX','Other'];
const POS_COLOR = { QB:'var(--pos-qb)', RB:'var(--pos-rb)', WR:'var(--pos-wr)', TE:'var(--pos-te)', FLEX:'var(--pos-flex)', Other:'var(--pos-other)' };
const POS_LABEL = { QB:'QB', RB:'RB', WR:'WR', TE:'TE', FLEX:'FLEX', Other:'K/DST' };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }

async function boot(){
  const manifest = await fetch('data/manifest.json').then(r => r.json());
  WEEK_NUMS = manifest.weeks.slice().sort((a,b) => a-b);
  for (const w of WEEK_NUMS){
    WEEKS[w] = await fetch(`data/week${w}.json`).then(r => r.json());
  }
  window.addEventListener('hashchange', render);
  render();
}

function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { view:'rankings', week: WEEK_NUMS[WEEK_NUMS.length-1] };
  if (h.startsWith('week/')) return { view:'rankings', week: Number(h.slice(5)) };
  if (h.startsWith('team/')) return { view:'team', team: decodeURIComponent(h.slice(5)) };
  return { view:'rankings', week: WEEK_NUMS[WEEK_NUMS.length-1] };
}

function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  app.innerHTML = route.view === 'team' ? teamPageHtml(route.team) : rankingsPageHtml(route.week);
  wireInteractions(route);
}

/* ---------------- header ---------------- */
function scoreboardHtml(activeWeek){
  const opts = WEEK_NUMS.map(w => `<option value="${w}" ${w===activeWeek?'selected':''}>WEEK ${w}</option>`).join('');
  return `
  <div class="scoreboard">
    <a href="#/" class="league">LATE NIGHT <span>HANDOFFS</span></a>
    <div class="meta">
      <select class="week-select" id="weekSelect">${opts}</select>
    </div>
  </div>`;
}

/* ---------------- rankings page ---------------- */
function rankingsPageHtml(weekNum){
  const wk = WEEKS[weekNum];
  if (!wk) return scoreboardHtml(weekNum) + `<div class="card">No data for week ${weekNum} yet.</div>`;
  const teams = Object.entries(wk.teams).map(([name,t]) => ({ name, ...t }));
  const byRank = teams.slice().sort((a,b) => a.rank - b.rank);
  const byScore = teams.slice().sort((a,b) => b.score - a.score);
  const maxScore = byScore[0].score;

  const best = wk.teams[wk.spotlight.best];
  const worst = wk.teams[wk.spotlight.worst];

  return `
    ${scoreboardHtml(weekNum)}

    <section>
      <div class="eyebrow">Spotlight</div>
      <div class="spotlights" style="margin-top:12px">
        <div class="spotlight best">
          <div class="tag">🏆 Best team</div>
          <div class="team-name">${esc(wk.spotlight.best)}</div>
          <div class="owner">${esc(best.owner)}</div>
          <div class="score-row"><span class="score">${fmt1(best.score)}</span><span class="record">${best.record} · league high</span></div>
          <ul>${wk.spotlight.best_bullets.map(b => `<li>${b}</li>`).join('')}</ul>
        </div>
        <div class="spotlight worst">
          <div class="tag">💀 Worst team</div>
          <div class="team-name">${esc(wk.spotlight.worst)}</div>
          <div class="owner">${esc(worst.owner)}</div>
          <div class="score-row"><span class="score">${fmt1(worst.score)}</span><span class="record">${worst.record} · league low</span></div>
          <ul>${wk.spotlight.worst_bullets.map(b => `<li>${b}</li>`).join('')}</ul>
        </div>
      </div>
    </section>

    <section>
      <div class="eyebrow">Power rankings</div>
      <div class="rankings" id="rankings" style="margin-top:12px">
        ${byRank.map(t => rankingRowHtml(t, weekNum)).join('')}
      </div>
    </section>

    <section>
      <div class="eyebrow">League scores — week ${weekNum}</div>
      <div class="card" style="margin-top:12px">
        <div class="bar-list">
          ${byScore.map((t,i) => `
            <div class="bar-item">
              <div class="rk">${i+1}</div>
              <div class="who">${esc(t.name)}<span class="tm">${esc(t.owner)}</span></div>
              <div class="track"><div class="fill" style="width:${(t.score/maxScore*100).toFixed(1)}%; background:${t.win? 'var(--green)':'var(--red)'}"></div></div>
              <div class="pts">${fmt1(t.score)}</div>
            </div>`).join('')}
        </div>
        <div class="legend" style="margin-top:12px">
          <span class="sw"><span class="dot" style="background:var(--green)"></span>Win</span>
          <span class="sw"><span class="dot" style="background:var(--red)"></span>Loss</span>
        </div>
      </div>
    </section>

    <section>
      <div class="eyebrow">Points by position — week ${weekNum}</div>
      <div class="card" style="margin-top:12px">
        <div class="sub">Where each team's score actually came from</div>
        ${stackedBarListHtml(byScore.map(t => ({ label:t.name, sub:t.owner, total:t.score, values:t.positionTotals })))}
      </div>
    </section>

    <section>
      <div class="eyebrow">Standouts</div>
      <div class="standouts-grid" style="margin-top:12px">
        <div class="card">
          <h3>Top scores, league-wide</h3>
          ${topScorersHtml(wk.top_scorers)}
        </div>
        <div class="card">
          <h3>Biggest busts</h3>
          <div class="bust-list">
            ${wk.busts.map(b => `
              <div class="bust">
                <div class="who">${esc(b.name)}<span class="tm">${esc(b.team)}</span></div>
                <div class="nums">${fmt1(b.actual)}<span class="proj">proj ${fmt1(b.proj)}</span></div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </section>

    <footer>Generated from live ESPN league data · ${esc(wk.league_name)}<span class="dot-sep">·</span>Week ${weekNum}</footer>
  `;
}

function rankingRowHtml(t, weekNum){
  const tick = t.rank - t.prevRank === 0 ? 0 : t.prevRank - t.rank;
  const tickClass = tick === 0 ? 'flat' : (tick > 0 ? 'up' : 'down');
  const tickLabel = tick === 0 ? '— 0' : (tick > 0 ? `▲ +${tick}` : `▼ ${tick}`);
  const lineupRows = t.lineup.map(pl => playerBarRow(pl)).join('');
  return `
    <div class="row" data-rank="${t.rank}">
      <button class="row-head" aria-expanded="false">
        <span class="rank-num">${t.rank}</span>
        <span class="tick ${tickClass}">${tickLabel}</span>
        <span class="team-block">
          <span class="team">${esc(t.name)}</span>
          <span class="owner">${esc(t.owner)} · ${t.win ? 'beat' : 'lost to'} ${esc(t.opp)}</span>
        </span>
        <span class="result"><span class="pts">${fmt1(t.score)}</span><span class="rec">${t.record}</span></span>
        <span class="chev">&#9656;</span>
      </button>
      <div class="row-body">
        <div class="blurb">${t.blurb}</div>
        <a class="view-team-link" href="#/team/${encodeURIComponent(t.name)}">View team → week-by-week</a>
        <div class="lineup">${lineupRows}</div>
        <div class="legend">
          <span class="sw"><span class="dot" style="background:var(--green)"></span>Beat projection</span>
          <span class="sw"><span class="dot" style="background:var(--red)"></span>Missed projection</span>
          <span class="sw"><span class="dot" style="background:var(--ink);opacity:.55;width:2px;border-radius:0;height:10px"></span>Projected pts</span>
        </div>
      </div>
    </div>`;
}

const BAR_MAX = 40;
function playerBarRow(pl){
  const beat = pl.a >= pl.j;
  const deltaVal = pl.a - pl.j;
  const deltaStr = (deltaVal >= 0 ? '+' : '') + deltaVal.toFixed(1);
  const fillPct = Math.min(100, (pl.a / BAR_MAX) * 100);
  const tickPct = Math.min(100, (pl.j / BAR_MAX) * 100);
  return `
    <div class="p-row">
      <div class="p-name"><span class="pos">${esc(POS_LABEL[pl.p] || pl.p)}</span>${esc(pl.n)}</div>
      <div class="p-bar-track">
        <div class="p-bar-fill ${beat?'beat':'missed'}" style="width:${fillPct}%"></div>
        <div class="p-tick" style="left:${tickPct}%"></div>
      </div>
      <div class="p-val">${pl.a.toFixed(1)}<span class="delta ${beat?'beat':'missed'}">${deltaStr}</span></div>
    </div>`;
}

function topScorersHtml(list){
  const max = list[0].pts;
  return `<div class="bar-list">${list.map((s,i) => `
    <div class="bar-item">
      <div class="rk">${i+1}</div>
      <div class="who">${esc(s.name)}<span class="tm">${esc(s.team)}</span></div>
      <div class="track"><div class="fill" style="width:${(s.pts/max*100).toFixed(1)}%; background:linear-gradient(90deg,#7a5417,var(--gold))"></div></div>
      <div class="pts">${fmt1(s.pts)}</div>
    </div>`).join('')}</div>`;
}

function stackedBarListHtml(rows){
  const maxTotal = Math.max(...rows.map(r => r.total));
  const legend = `<div class="stack-legend">${POS_ORDER.map(p => `<span class="sw"><span class="dot" style="background:${POS_COLOR[p]}"></span>${POS_LABEL[p]}</span>`).join('')}</div>`;
  const list = rows.map(r => {
    const widthPct = (r.total / maxTotal * 100).toFixed(1);
    const segs = POS_ORDER.map(p => {
      const v = Math.max(r.values[p] || 0, 0);
      const pct = r.total > 0 ? (v / r.total * 100) : 0;
      return pct > 0 ? `<div class="stack-seg" style="width:${pct}%; background:${POS_COLOR[p]}" title="${POS_LABEL[p]}: ${fmt1(v)}"></div>` : '';
    }).join('');
    return `
      <div class="stack-row">
        <div class="head"><b>${esc(r.label)}</b><span class="tot">${fmt1(r.total)}</span></div>
        <div class="stack-track" style="width:${widthPct}%">${segs}</div>
      </div>`;
  }).join('');
  return `<div class="stack-list">${list}</div>${legend}`;
}

/* ---------------- team page ---------------- */
function teamPageHtml(teamName){
  const weeksWithTeam = WEEK_NUMS.filter(w => WEEKS[w].teams[teamName]);
  if (!weeksWithTeam.length) return `<div class="card">Team not found.</div>`;
  const latestWk = weeksWithTeam[weeksWithTeam.length - 1];
  const latest = WEEKS[latestWk].teams[teamName];

  const wins = weeksWithTeam.filter(w => WEEKS[w].teams[teamName].win).length;
  const losses = weeksWithTeam.length - wins;
  const avgScore = weeksWithTeam.reduce((s,w) => s + WEEKS[w].teams[teamName].score, 0) / weeksWithTeam.length;

  const trendPoints = weeksWithTeam.map(w => ({ week:w, score: WEEKS[w].teams[teamName].score, win: WEEKS[w].teams[teamName].win }));
  const maxTrend = Math.max(...trendPoints.map(p => p.score));

  const stackRows = weeksWithTeam.map(w => ({ label:`Week ${w}`, total: WEEKS[w].teams[teamName].score, values: WEEKS[w].teams[teamName].positionTotals }));

  // union of player names across weeks (most recent lineup order first)
  const seen = new Set();
  const playerOrder = [];
  for (const w of [...weeksWithTeam].reverse()){
    for (const pl of WEEKS[w].teams[teamName].lineup){
      if (!seen.has(pl.n)){ seen.add(pl.n); playerOrder.push({ n: pl.n, p: pl.p }); }
    }
  }

  return `
    ${scoreboardHtml(latestWk)}
    <a class="back-link" href="#/week/${latestWk}">← Back to power rankings</a>

    <section class="team-header">
      <div class="name">${esc(teamName)}</div>
      <div class="sub">${esc(latest.owner)} · ${wins}-${losses} · avg ${fmt1(avgScore)} pts/wk</div>
    </section>

    <div class="stat-strip">
      <div class="stat-tile"><div class="lbl">Current rank</div><div class="val">#${latest.rank}</div></div>
      <div class="stat-tile"><div class="lbl">Last score</div><div class="val">${fmt1(latest.score)}</div></div>
      <div class="stat-tile"><div class="lbl">Record</div><div class="val">${latest.record}</div></div>
    </div>

    <section>
      <div class="eyebrow">Score by week</div>
      <div class="card" style="margin-top:12px">
        <div class="trend-scroll">
          <div class="trend-chart">
            ${trendPoints.map(p => `
              <div class="trend-col">
                <div class="trend-val">${fmt1(p.score)}</div>
                <div class="trend-bar ${p.win?'win':'loss'}" style="height:${Math.max(6,(p.score/maxTrend*100))}%"></div>
                <div class="trend-lbl">Wk${p.week}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="legend" style="margin-top:12px">
          <span class="sw"><span class="dot" style="background:var(--green)"></span>Win</span>
          <span class="sw"><span class="dot" style="background:var(--red)"></span>Loss</span>
        </div>
        ${weeksWithTeam.length < 3 ? `<div class="sub" style="margin-top:10px">Trend line fills in as more weeks are added.</div>` : ''}
      </div>
    </section>

    <section>
      <div class="eyebrow">Points by position — by week</div>
      <div class="card" style="margin-top:12px">
        ${stackedBarListHtml(stackRows)}
      </div>
    </section>

    <section>
      <div class="eyebrow">Player performance — by week</div>
      <div class="card" style="margin-top:12px">
        <div class="sub">Green fill = beat projection that week · red = missed it</div>
        <div class="player-table-scroll">
          <div class="player-table" style="--wk:${weeksWithTeam.length}">
            <div class="ptable-head"><span>Player</span>${weeksWithTeam.map(w => `<span>Wk${w}</span>`).join('')}</div>
            ${playerOrder.map(pl => playerWeekRow(pl, teamName, weeksWithTeam)).join('')}
          </div>
        </div>
      </div>
    </section>

    <footer>Generated from live ESPN league data · ${esc(WEEKS[latestWk].league_name)}</footer>
  `;
}

function playerWeekRow(player, teamName, weeksWithTeam){
  const cells = weeksWithTeam.map(w => {
    const lineup = WEEKS[w].teams[teamName].lineup;
    const rec = lineup.find(x => x.n === player.n);
    if (!rec) return `<div class="ptable-cell"></div>`;
    const beat = rec.a >= rec.j;
    const pct = Math.min(100, (rec.a / BAR_MAX) * 100);
    return `
      <div class="ptable-cell">
        <div class="ptable-fill ${beat?'beat':'missed'}" style="width:${pct}%"></div>
        <div class="ptable-num">${rec.a.toFixed(1)}</div>
      </div>`;
  }).join('');
  return `
    <div class="ptable-row">
      <div class="ptable-name"><span class="pos">${esc(POS_LABEL[player.p] || player.p)}</span>${esc(player.n)}</div>
      ${cells}
    </div>`;
}

/* ---------------- interactions ---------------- */
function wireInteractions(route){
  document.querySelectorAll('.row-head').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('.row');
      const isOpen = row.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(isOpen));
    });
  });
  const sel = document.getElementById('weekSelect');
  if (sel) sel.addEventListener('change', () => { location.hash = `/week/${sel.value}`; });
}

boot();
</script>
</body>
</html>
